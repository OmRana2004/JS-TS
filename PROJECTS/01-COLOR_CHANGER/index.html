<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocumenColor Changer</title>
</head>
<body>
    <nav>
        <a href="/">HOME</a>
        <a href="https://youtube.com">YOUTUBE</a>
    </nav>
    <div class="canvas">
        <h1>Color Scheme Switcher</h1>
        <span class="button" id="grey">GRAY</span>
        <span class="button" id="white">WHITE</span>
        <span class="button" id="blue">BLUE</span>
        <span class="button" id="yellow">YELLOW</span>
        <h2>
            Try clicking on one of the color above
            <span>to change the background color of this page</span>
        </h2>
    </div>
    <script src="index.js"></script>
</body>
</html>
