<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add-Language</title>
</head>
<body style="color: aliceblue; background-color: black;">
    <ul class="language">
        <li>JAVASCRIPT</li>
    </ul>
</body>
<script>
    function addLan(lanName) {
        const li = document.createElement('li');
        li.innerHTML = `${lanName}`
        document.querySelector('.language').appendChild(li)
    }
    addLan("python")

    const addOptLan = (lanName) => {
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(lanName))
        document.querySelector('.language').appendChild(li)
    }
    addOptLan("golang")

    //EDIT
    const seconLan = document.querySelector("li:nth-child(2)")
    // seconLan.innerHTML = "Mojo"
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    seconLan.replaceWith(newli)

    //edit
    const firstLan = document.querySelector("li:first-child")
    firstLan.outerHTML = '<li>TYPESCRIPT</li>'

    //REMOVE
    const lastLan = document.querySelector("li:last-child")
    lastLan.remove()

</script>
</html>
