<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BMI_CALCULATOR</title>
</head>
<body style="color: beige; background-color: rgba(18, 18, 18, 0.786);">
    <nav style="display: flex; justify-content: center;">
        <a href="/">HOME</a>
        <a href="https://youtube.com">YOUTUBE</a>
    </nav>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p><label for="height">Height in CM: </label><input type="number" id="height"></p>
            <p><label for="weight">Weight in KG: </label><input type="number" id="weight"></p>
            <button>Calculator</button>
            <div id="results"></div>
            <div id="weight-guid">
                <h3>BMI Weight Guie</h3>
                <p>Under Weight = Less than 18.6</p>
                <p>Normal Range = 18.6 and 24.9</p>
                <p>Overweight = Greater than 24.9</p>
            </div>
        </form>
    </div>
</body>
<script src="index.js"></script>
</html>
