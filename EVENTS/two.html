<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTS-ASYNC-JS</title>
</head>
<body>
    <h1>JAI SHRI RAM</h1>
    <button id="stop">stop</button>
    <button id="inc">INC</button>
    <p id="count">1</p>
</body>
<script>
    const sayJaiShriRam = () => {
        console.log("JaiShriRam");
    }

    const changeText = () => {
        document.querySelector('h1').innerHTML = "SITA RAM"
    }

   const change = setTimeout(() => {
    changeText()
   },6000)

   document.querySelector('#stop').addEventListener('click',(()=>{
        clearTimeout(change)
        console.log("STOPPED");
   }))
    
    
        let c = 0;
        const display = document.querySelector('#count')
        document.querySelector('#inc').onclick = () => {
            c++;
            display.textContent = c;
            console.log(c);
        }
        
        
    
   


</script>
</html>
